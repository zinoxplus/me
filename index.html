<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XLMC - CS2 Edition</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--o:#ffb300;--bg:#0d0d0d;--p:#7b5cff}
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,Tahoma,sans-serif}
body{background:#111;color:#fff;overflow:hidden}
.bg{position:fixed;inset:0;background:url("https://4kwallpapers.com/images/walls/thumbs_2t/2261.png") center/cover no-repeat;filter:brightness(.35);z-index:-5}
body:before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(transparent 0 3px,rgba(255,255,255,.02) 4px);pointer-events:none;animation:scan 8s linear infinite}
@keyframes scan{to{background-position:0 200px}}
body:after{content:"";position:fixed;inset:0;background:radial-gradient(circle at center,transparent 0 70px,rgba(0,0,0,.35) 71px),linear-gradient(#0002,#000b);pointer-events:none}
.cross{position:fixed;left:50%;top:50%;width:24px;height:24px;transform:translate(-50%,-50%);opacity:.12}
.cross:before,.cross:after{content:"";position:absolute;background:#fff}
.cross:before{left:11px;top:0;width:2px;height:24px}
.cross:after{top:11px;left:0;height:2px;width:24px}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:760px;max-width:95%;padding:35px;background:rgba(15,15,15,.88);border:1px solid #555;border-radius:18px;backdrop-filter:blur(14px);box-shadow:0 0 20px #000,0 0 35px rgba(123,92,255,.35),0 0 20px rgba(255,179,0,.25);animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translate(-50%,-51%)}}
.card:before{content:"";position:absolute;inset:-2px;border-radius:18px;padding:2px;background:linear-gradient(90deg,var(--o),#fff,var(--p),var(--o));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:border 5s linear infinite}
@keyframes border{to{filter:hue-rotate(360deg)}}
h1{text-align:center;color:var(--o);font-size:44px;letter-spacing:8px;text-shadow:0 0 15px var(--o);animation:glitch 3s infinite}
@keyframes glitch{2%{transform:translateX(2px)}4%{transform:translateX(-2px)}6%,100%{transform:none}}
.info{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:25px 0}
.field{background:#1a1a1a;border:1px solid #333;border-left:3px solid var(--o);padding:14px;border-radius:10px;transition:.25s;display:flex;gap:10px}
.field:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 0 18px rgba(255,179,0,.2)}
.field i{color:var(--o)}
.progress{height:8px;background:#333;border-radius:99px;overflow:hidden;cursor:pointer}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--o),#fff,var(--p))}
.controls{display:flex;justify-content:center;gap:24px;margin:18px 0}
.controls i,.steam{transition:.25s}
.controls i{background:#1e1e1e;padding:12px;border-radius:8px;color:var(--o);cursor:pointer}
.controls i:hover,.steam:hover{box-shadow:0 0 18px rgba(255,179,0,.5);transform:translateY(-2px)}
.playlist{margin-top:15px;background:#151515;padding:10px;border-radius:10px;max-height:180px;overflow:auto}
.track{padding:10px;border-radius:6px;cursor:pointer}
.track:hover,.active{background:var(--o);color:#000}
.steam{position:fixed;right:20px;top:20px;padding:12px 18px;background:var(--o);color:#000;text-decoration:none;border-radius:10px;font-weight:bold}
footer{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000b;padding:10px 18px;border-radius:10px;color:var(--o)}
.particles i{position:fixed;top:-10px;width:2px;height:8px;background:#ffffff22;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh)}}
@media(max-width:768px){.info{grid-template-columns:1fr}h1{font-size:30px}}
</style>
</head>
<body>
<div class="bg"></div><div class="cross"></div>
<div class="particles"></div>
<a class="steam" href="https://steamcommunity.com/id/M_LMC/" target="_blank"><i class="fab fa-steam"></i> Steam Profile</a>
<div class="card">
<h1>X LMC</h1>
<div class="info">
<div class="field"><i class="fa fa-user"></i>Age:20</div>
<div class="field"><i class="fa fa-clock"></i>Timeplay CS:800h</div>
<div class="field"><i class="fa fa-trophy"></i>Rank:12000</div>
<div class="field"><i class="fa fa-layer-group"></i>Steam Level:22</div>
<div class="field"><i class="fab fa-discord"></i>@mahdiyar_lmc</div>
<div class="field"><i class="fab fa-telegram"></i>@X_LMC</div>
<div class="field"><i class="fa fa-quote-left"></i>My homeland was destroyed</div>
</div>
<audio id="audio"></audio>
<div class="progress" onclick="seek(event)"><div class="bar" id="bar"></div></div>
<div class="controls">
<i class="fa fa-backward" onclick="prev()"></i>
<i class="fa fa-play" id="playBtn" onclick="togglePlay()"></i>
<i class="fa fa-forward" onclick="next()"></i>
</div>
<div id="time">00:00 / 00:00</div>
<div class="playlist" id="playlist"></div>
</div>
<footer>⛓️‍💥 IRAN 💔</footer>
<script>
const tracks=[
{title:"Nothing After",src:"https://raw.githubusercontent.com/zinoxplus/me/main/nothing_after.mp3"},
{title:"eyes in end *R",src:"https://raw.githubusercontent.com/zinoxplus/me/main/LLLH.mp3"},
{title:"★Fr-VOID *R❤︎",src:"https://raw.githubusercontent.com/zinoxplus/me/main/lhzzz.mp3"}];
const audio=document.getElementById("audio"),bar=document.getElementById("bar"),time=document.getElementById("time"),playlist=document.getElementById("playlist"),playBtn=document.getElementById("playBtn");let current=0;
tracks.forEach((t,i)=>{let d=document.createElement("div");d.className="track";d.innerText=t.title;d.onclick=()=>loadTrack(i,true);playlist.appendChild(d)});
function loadTrack(i,a=false){current=i;audio.src=tracks[i].src;[...playlist.children].forEach(x=>x.classList.remove("active"));playlist.children[i].classList.add("active");if(a)audio.play().then(()=>playBtn.className="fa fa-pause")}
function togglePlay(){if(audio.paused){audio.play();playBtn.className="fa fa-pause"}else{audio.pause();playBtn.className="fa fa-play"}}
function next(){loadTrack((current+1)%tracks.length,true)}function prev(){loadTrack((current-1+tracks.length)%tracks.length,true)}
audio.ontimeupdate=()=>{if(audio.duration){bar.style.width=audio.currentTime/audio.duration*100+"%";time.textContent=new Date(audio.currentTime*1000).toISOString().substr(14,5)+" / "+new Date(audio.duration*1000).toISOString().substr(14,5)}}
function seek(e){let r=e.currentTarget.getBoundingClientRect();audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration}
loadTrack(0);
const p=document.querySelector(".particles");
for(let i=0;i<70;i++){let s=document.createElement("i");s.style.left=Math.random()*100+"vw";s.style.animationDuration=(4+Math.random()*8)+"s";s.style.animationDelay=(-Math.random()*8)+"s";p.appendChild(s);}
document.addEventListener("mousemove",e=>document.body.style.background=`radial-gradient(circle at ${e.clientX}px ${e.clientY}px,rgba(255,179,0,.08),transparent 180px),#111`);
</script>
</body></html>
