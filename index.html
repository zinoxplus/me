<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title> XLMC </title>

<meta name="description" content="XLMC Counter Strike 2 Player Profile">

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<!-- Background -->

<div class="bg-layer"></div>
<div class="overlay"></div>
<div class="noise"></div>
<div class="grid-bg"></div>

<!-- Effects -->

<div class="mouse-light"></div>

<div id="particles"></div>

<!-- Main Container -->

<div class="container">

    <!-- HUD Decoration -->

    <div class="hud-top"></div>
    <div class="hud-bottom"></div>

    <!-- Profile Panel -->

    <section class="profile-panel">
        
        <span class="corner corner-tl"></span>
<span class="corner corner-tr"></span>
<span class="corner corner-bl"></span>
<span class="corner corner-br"></span>

        <div class="panel-glow"></div>

        <!-- Header -->

        <header class="profile-header">

            <div class="logo-area">

                <h1 class="logo">

                    XLMC

                </h1>

                <div class="logo-line"></div>

                <p class="subtitle">

                    pain :(

                </p>

            </div>

        </header>

        <!-- Stats -->

        <section class="stats-grid">

            <div class="stat-card">

                <div class="card-icon">
                    🎂
                </div>

                <div class="card-label">
                    AGE
                </div>

                <div class="card-value">
                    20
                </div>

            </div>

            <div class="stat-card">

                <div class="card-icon">
                    🎮
                </div>

                <div class="card-label">
                    CS2 HOURS
                </div>

                <div class="card-value">
                    800
                </div>

            </div>

            <div class="stat-card">

                <div class="card-icon">
                    🏆
                </div>

                <div class="card-label">
                    PREMIER RANK
                </div>

                <div class="card-value">
                    12000
                </div>

            </div>

            <div class="stat-card">

                <div class="card-icon">
                    ⭐
                </div>

                <div class="card-label">
                    STEAM LEVEL
                </div>

                <div class="card-value">
                    22
                </div>

            </div>

            <div class="stat-card">

                <div class="card-icon">
                    💬
                </div>

                <div class="card-label">
                    DISCORD
                </div>

                <div class="card-value">
                    mahdiyar_lmc
                </div>

            </div>

            <div class="stat-card">

                <div class="card-icon">
                    📨
                </div>

                <div class="card-label">
                    TELEGRAM
                </div>

                <div class="card-value">
                    X_LMC
                </div>

            </div>

        </section>

        <!-- Buttons -->

        <section class="action-area">

            <a
            href="https://steamcommunity.com/id/M_LMC/"
            target="_blank"
            class="steam-btn">

                <span>
                    Steam Profile
                </span>

            </a>

        </section>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
