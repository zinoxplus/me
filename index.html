
<!DOCTYPE html><html lang="fa">
<head>
<title>XLMC</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><!-- Font Awesome --><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/><!-- Minecraft Font --><link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet"><style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Minecraft',sans-serif;
}

body{
background:#111;
color:#fff;
overflow:hidden;
image-rendering:pixelated;
}

/* BACKGROUND */
.bg{
position:fixed;
inset:0;
background:url('githubusercontent.com/zinoxplus/me/main/InShot_20260613_210312539.gif') center/cover no-repeat;
filter:brightness(.75) contrast(1.2);
z-index:-2;
animation:bgZoom 20s infinite alternate ease-in-out;
}

@keyframes bgZoom{
from{transform:scale(1)}
to{transform:scale(1.1)}
}

body::before{
content:"";
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
z-index:-1;
}

/* STEAM BUTTON */
.steam{
position:fixed;
top:20px;
right:20px;
background:#7a7a7a;
color:#fff;
padding:12px 18px;
text-decoration:none;
font-size:13px;

border-top:3px solid #fff;
border-left:3px solid #fff;
border-right:3px solid #444;
border-bottom:3px solid #444;

box-shadow:0 0 0 2px #000;
transition:.15s;
}

.steam:hover{
background:#55aa55;
transform:translateY(2px);
}

/* CARD */
.card{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:650px;
padding:35px;

background:#c6c6c6;

border-top:4px solid #fff;
border-left:4px solid #fff;
border-right:4px solid #555;
border-bottom:4px solid #555;

box-shadow:0 0 0 4px #000, 8px 8px 0 #000;

animation:fade .6s ease;
}

@keyframes fade{
from{opacity:0;transform:translate(-50%,-55%)}
to{opacity:1;transform:translate(-50%,-50%)}
}

h1{
text-align:center;
margin-bottom:30px;
letter-spacing:3px;
color:#55ff55;
text-shadow:2px 2px 0 #000, 4px 4px 0 #000;
}

/* INFO GRID */
.info{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
margin-bottom:35px;
}

.field{
background:#8b8b8b;
padding:14px;

border-top:3px solid #fff;
border-left:3px solid #fff;
border-right:3px solid #555;
border-bottom:3px solid #555;

display:flex;
align-items:center;
gap:12px;

transition:.15s;
}

.field:hover{
background:#9f9f9f;
transform:translateY(-2px);
}

.field i{
font-size:18px;
width:22px;
text-align:center;
}

/* PLAYER */
.player{
margin-top:20px;
}

.progress{
height:16px;
background:#555;

border-top:2px solid #222;
border-left:2px solid #222;
border-right:2px solid #999;
border-bottom:2px solid #999;

overflow:hidden;
cursor:pointer;
}

.bar{
height:100%;
width:0%;
background:#55ff55;
}

.controls{
margin-top:15px;
display:flex;
justify-content:center;
gap:30px;
font-size:22px;
}

.controls i{
cursor:pointer;

background:#8b8b8b;
color:#fff;
padding:10px 14px;

border-top:3px solid #fff;
border-left:3px solid #fff;
border-right:3px solid #555;
border-bottom:3px solid #555;

transition:.15s;
}

.controls i:hover{
background:#55aa55;
transform:translateY(2px);
}

.time{
margin-top:10px;
text-align:center;
font-size:13px;
color:#000;
}

/* PLAYLIST */
.playlist{
margin-top:15px;

background:#6b6b6b;

border-top:3px solid #fff;
border-left:3px solid #fff;
border-right:3px solid #444;
border-bottom:3px solid #444;

padding:10px;
}

.track{
padding:10px;
cursor:pointer;
font-size:13px;
transition:.15s;
}

.track:hover{
background:#55aa55;
}

.active{
background:#55ff55;
color:#000;
}

/* FOOTER */
footer{
position:fixed;
bottom:15px;
left:50%;
transform:translateX(-50%);

background:#7a7a7a;
padding:8px 15px;

border-top:3px solid #fff;
border-left:3px solid #fff;
border-right:3px solid #444;
border-bottom:3px solid #444;

box-shadow:0 0 0 2px #000;
color:#fff;
}
</style></head><body><div class="bg"></div><a class="steam" target="_blank" href="https://steamcommunity.com/id/M_LMC/">
<i class="fab fa-steam"></i> Steam Profile
</a><div class="card"><h1>X LMC</h1><div class="info">
<div class="field"><i class="fa fa-user"></i> Age: 20</div>
<div class="field"><i class="fa fa-clock"></i> Timeplay CS: 800h</div>
<div class="field"><i class="fa fa-trophy"></i> Rank: 12000</div>
<div class="field"><i class="fa fa-layer-group"></i> Steam Level: 22</div>
<div class="field"><i class="fab fa-discord"></i> @mahdiyar_lmc</div>
<div class="field"><i class="fab fa-telegram"></i> @X_LMC</div>
<div class="field"><i class="fa fa-quote-left"></i> My homeland was destroyed</div>
</div><div class="player"><audio id="audio" preload="auto"></audio>

<div class="progress" onclick="seek(event)">
<div class="bar" id="bar"></div>
</div><div class="controls">
<i class="fa fa-backward" onclick="prev()"></i>
<i class="fa fa-play" id="playBtn" onclick="togglePlay()"></i>
<i class="fa fa-forward" onclick="next()"></i>
</div><div class="time" id="time">00:00 / 00:00</div><div class="playlist" id="playlist"></div></div>
</div><script>
const tracks = [
{title:"Nothing After",src:"https://raw.githubusercontent.com/zinoxplus/me/main/nothing_after.mp3"},
{title:"eyes in end *R",src:"https://raw.githubusercontent.com/zinoxplus/me/main/LLLH.mp3"},
{title:"★Fr-VOID *R❤︎ (Wait for it to play)",src:"https://raw.githubusercontent.com/zinoxplus/me/main/lhzzz.mp3"}
];

const audio=document.getElementById("audio");
const bar=document.getElementById("bar");
const time=document.getElementById("time");
const playlist=document.getElementById("playlist");
const playBtn=document.getElementById("playBtn");

let current=0;

tracks.forEach((track,i)=>{
let div=document.createElement("div");
div.className="track";
div.innerText=track.title;
div.onclick=()=>loadTrack(i,true);
playlist.appendChild(div);
});

function loadTrack(i,autoplay=false){
current=i;
audio.src=tracks[i].src;
document.querySelectorAll(".track").forEach(t=>t.classList.remove("active"));
playlist.children[i].classList.add("active");
if(autoplay) audio.play().then(()=>playBtn.className="fa fa-pause");
}

function togglePlay(){
if(audio.paused){
audio.play();
playBtn.className="fa fa-pause";
}else{
audio.pause();
playBtn.className="fa fa-play";
}
}

function next(){
current=(current+1)%tracks.length;
loadTrack(current,true);
}

function prev(){
current=(current-1+tracks.length)%tracks.length;
loadTrack(current,true);
}

audio.ontimeupdate=()=>{
if(audio.duration){
bar.style.width=(audio.currentTime/audio.duration*100)+"%";
time.textContent=Math.floor(audio.currentTime/60).toString().padStart(2,'0')+":"+Math.floor(audio.currentTime%60).toString().padStart(2,'0')
+" / "+Math.floor(audio.duration/60).toString().padStart(2,'0')+":"+Math.floor(audio.duration%60).toString().padStart(2,'0');
}
}

function seek(e){
const rect=e.currentTarget.getBoundingClientRect();
const percent=(e.clientX-rect.left)/rect.width;
audio.currentTime=percent*audio.duration;
}

window.onload=()=>{
loadTrack(0,true);
}
</script><footer>⛓️‍💥 IRAN 💔</footer></body>
</html>
