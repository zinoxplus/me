<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XLMC - CS2 Edition</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="bg"></div>
<a class="steam" href="https://steamcommunity.com/id/M_LMC/" target="_blank">Steam Profile</a>

<div class="card">
<h1>X LMC</h1>

<div class="info">
<div class="field">Age:20</div>
<div class="field">Timeplay CS:800h</div>
<div class="field">Rank:12000</div>
<div class="field">Steam Level:22</div>
<div class="field">@mahdiyar_lmc</div>
<div class="field">@X_LMC</div>
<div class="field">My homeland was destroyed</div>
</div>

<audio id="audio"></audio>

<div class="progress" id="progress"><div class="bar" id="bar"></div></div>
<div id="time">00:00 / 00:00</div>

<div class="controls">
<button id="prev">⏮</button>
<button id="play">▶</button>
<button id="next">⏭</button>
<button id="shuffle">🔀</button>
<button id="repeat">🔁</button>
</div>

<input type="range" id="volume" min="0" max="1" step="0.01" value="1">

<canvas id="visualizer"></canvas>

<div class="playlist" id="playlist"></div>
</div>

<footer>⛓️‍💥 IRAN 💔</footer>

<script src="js/music-player.js"></script>
<script src="js/main.js"></script>
</body>
</html>
