<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XLMC</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,Tahoma,sans-serif}
body{
background:#111;color:#fff;overflow:hidden;
}
.bg{
position:fixed;inset:0;
background:url("https://images7.alphacoders.com/134/1343614.jpeg") center/cover no-repeat;
filter:brightness(.45);
z-index:-2;
}
body::after{
content:"";position:fixed;inset:0;
background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.8));
z-index:-1;
}
.steam{
position:fixed;top:20px;right:20px;
background:#ffb300;color:#000;padding:12px 18px;
text-decoration:none;border-radius:8px;font-weight:bold;
}
.card{
position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
width:700px;padding:35px;background:rgba(15,15,15,.92);
border:1px solid rgba(255,170,0,.35);border-radius:12px;
backdrop-filter:blur(12px);
}
h1{text-align:center;margin-bottom:30px;color:#ffb300;font-size:42px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:35px}
.field{
background:#1b1b1b;border:1px solid #2a2a2a;padding:14px;
display:flex;align-items:center;gap:12px;border-radius:8px;
}
.field i{color:#ffb300}
.progress{height:8px;background:#333;border-radius:20px;overflow:hidden;cursor:pointer}
.bar{height:100%;width:0;background:#ffb300}
.controls{margin-top:15px;display:flex;justify-content:center;gap:30px}
.controls i{
background:#1e1e1e;color:#ffb300;padding:12px;border-radius:8px;cursor:pointer
}
.time{text-align:center;margin-top:10px}
.playlist{margin-top:15px;background:#151515;border-radius:8px;padding:10px}
.track{padding:12px;border-radius:6px;cursor:pointer}
.track:hover{background:#262626}
.active{background:#ffb300;color:#000;font-weight:bold}
footer{
position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
background:rgba(0,0,0,.8);padding:10px 18px;border-radius:8px;color:#ffb300
}
@media(max-width:768px){
.card{width:95%;padding:20px}
.info{grid-template-columns:1fr}
h1{font-size:28px}
}
</style>
</head>
<body>
<div class="bg"></div>
<a class="steam" target="_blank" href="https://steamcommunity.com/id/M_LMC/"><i class="fab fa-steam"></i> Steam Profile</a>

<div class="card">
<h1>X LMC</h1>
<div class="info">
<div class="field"><i class="fa fa-user"></i> Age: 20</div>
<div class="field"><i class="fa fa-clock"></i> Timeplay CS: 800h</div>
<div class="field"><i class="fa fa-trophy"></i> Rank: 12000</div>
<div class="field"><i class="fa fa-layer-group"></i> Steam Level: 22</div>
<div class="field"><i class="fab fa-discord"></i> @mahdiyar_lmc</div>
<div class="field"><i class="fab fa-telegram"></i> @X_LMC</div>
<div class="field"><i class="fa fa-quote-left"></i> My homeland was destroyed</div>
</div>

<div class="player">
<audio id="audio" preload="auto"></audio>
<div class="progress" onclick="seek(event)"><div class="bar" id="bar"></div></div>
<div class="controls">
<i class="fa fa-backward" onclick="prev()"></i>
<i class="fa fa-play" id="playBtn" onclick="togglePlay()"></i>
<i class="fa fa-forward" onclick="next()"></i>
</div>
<div class="time" id="time">00:00 / 00:00</div>
<div class="playlist" id="playlist"></div>
</div>
</div>

<footer>⛓️‍💥 IRAN 💔</footer>

<script>
const tracks=[
{title:"Nothing After",src:"https://raw.githubusercontent.com/zinoxplus/me/main/nothing_after.mp3"},
{title:"eyes in end *R",src:"https://raw.githubusercontent.com/zinoxplus/me/main/LLLH.mp3"},
{title:"★Fr-VOID *R❤︎",src:"https://raw.githubusercontent.com/zinoxplus/me/main/lhzzz.mp3"}
];
const audio=document.getElementById("audio"),bar=document.getElementById("bar"),time=document.getElementById("time"),playlist=document.getElementById("playlist"),playBtn=document.getElementById("playBtn");
let current=0;
tracks.forEach((t,i)=>{let d=document.createElement("div");d.className="track";d.innerText=t.title;d.onclick=()=>loadTrack(i,true);playlist.appendChild(d)});
function loadTrack(i,a=false){current=i;audio.src=tracks[i].src;document.querySelectorAll(".track").forEach(t=>t.classList.remove("active"));playlist.children[i].classList.add("active");if(a)audio.play().then(()=>playBtn.className="fa fa-pause");}
function togglePlay(){if(audio.paused){audio.play();playBtn.className="fa fa-pause";}else{audio.pause();playBtn.className="fa fa-play";}}
function next(){current=(current+1)%tracks.length;loadTrack(current,true);}
function prev(){current=(current-1+tracks.length)%tracks.length;loadTrack(current,true);}
audio.ontimeupdate=()=>{if(audio.duration){bar.style.width=(audio.currentTime/audio.duration*100)+"%";time.textContent=Math.floor(audio.currentTime/60).toString().padStart(2,'0')+":"+Math.floor(audio.currentTime%60).toString().padStart(2,'0')+" / "+Math.floor(audio.duration/60).toString().padStart(2,'0')+":"+Math.floor(audio.duration%60).toString().padStart(2,'0');}};
function seek(e){const r=e.currentTarget.getBoundingClientRect();audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;}
window.onload=()=>loadTrack(0,true);
</script>
</body>
</html>
